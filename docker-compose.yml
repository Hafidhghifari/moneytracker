services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_TRANSACTIONS_MOCK: "1"
    container_name: moneyhist-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:17-alpine
    container_name: moneyhist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneyhist
      POSTGRES_PASSWORD: moneyhist
      POSTGRES_DB: moneyhist
    ports:
      - "55432:5432"
    volumes:
      - moneyhist-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyhist -d moneyhist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moneyhist-db-data:
